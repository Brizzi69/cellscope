<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellScope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="tooltip"></div>
    <div id="controls">
      <label>size <input id="sizeSlider" type="range" min="0.005" max="0.08" step="0.001" value="0.03"></label>
      <select id="embSelect">
        <option value="pca">PCA (real ~2.6k)</option>
        <option value="synth_100k">Synthetic 100k</option>
        <option value="synth_500k">Synthetic 500k</option>
      </select>
      <button id="variantBtn">show spheres</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
